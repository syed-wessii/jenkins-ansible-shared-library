---
- name: Install Redis build dependencies on Debian family
  ansible.builtin.apt:
    name:
      - build-essential
      - tcl
      - libsystemd-dev
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Redis build dependencies on RedHat family
  ansible.builtin.dnf:
    name:
      - gcc
      - make
      - tcl
      - systemd-devel
    state: present
  when: ansible_os_family == "RedHat"

- name: Download Redis source archive
  ansible.builtin.get_url:
    url: "https://download.redis.io/releases/redis-{{ redis_version }}.tar.gz"
    dest: "/tmp/redis-{{ redis_version }}.tar.gz"
    mode: "0644"

- name: Extract Redis source
  ansible.builtin.unarchive:
    src: "/tmp/redis-{{ redis_version }}.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/redis-{{ redis_version }}"

- name: Compile Redis
  ansible.builtin.command:
    cmd: make
    chdir: "/tmp/redis-{{ redis_version }}"
  args:
    creates: "/tmp/redis-{{ redis_version }}/src/redis-server"

- name: Install Redis binaries
  ansible.builtin.command:
    cmd: make install
    chdir: "/tmp/redis-{{ redis_version }}"
  args:
    creates: "/usr/local/bin/redis-server"

- name: Create Redis group
  ansible.builtin.group:
    name: "{{ redis_group }}"
    state: present

- name: Create Redis user
  ansible.builtin.user:
    name: "{{ redis_user }}"
    group: "{{ redis_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ redis_config_dir }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0755"

- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ redis_data_dir }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0750"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_log_dir }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0750"

- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_config_file }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0644"
  notify: Restart Redis

- name: Deploy Redis systemd service
  ansible.builtin.template:
    src: redis.service.j2
    dest: "/etc/systemd/system/{{ redis_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Redis

- name: Enable and start Redis
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
